server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy case images (registered)
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy user-uploaded photos
    location /user-uploads/ {
        proxy_pass http://backend:8000/user-uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
