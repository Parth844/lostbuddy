services:

  frontend:
    build:
      context: ./app
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: pehchaan_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  backend:
    build: ./backend
    container_name: pehchaan_backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: faces_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      QDRANT_URL: http://qdrant:6333
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-300}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pehchaan.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FACE_MODEL: ${FACE_MODEL:-buffalo_s}
      FACE_CTX_ID: ${FACE_CTX_ID:--1}
      FACE_DET_SIZE: ${FACE_DET_SIZE:-640}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.60}
      ESCALATION_THRESHOLD: ${ESCALATION_THRESHOLD:-0.75}
      REPORT_MATCH_THRESHOLD: ${REPORT_MATCH_THRESHOLD:-0.65}
      RERANK_BOOST: ${RERANK_BOOST:-0.03}
    depends_on:
      - postgres
      - qdrant
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - ./final_images:/app/final_images
      - ./user_uploads:/app/user_uploads
      - ./pehchaan:/app/pehchaan
    restart: always

  postgres:
    image: postgres:15
    platform: linux/amd64
    container_name: pehchaan_postgres
    environment:
      POSTGRES_DB: faces_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: always

  qdrant:
    image: qdrant/qdrant
    container_name: pehchaan_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always
